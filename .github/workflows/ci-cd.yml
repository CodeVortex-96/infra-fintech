name: Fintech GitOps Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'k8s/deployment.yaml'

jobs:
  # Job 1: Validação de Infraestrutura (Não quebra a lógica anterior)
  terraform-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Terraform Validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

  # Job 2: O seu fluxo de GitOps (Depende do sucesso do terraform-check)
  gitops-sync:
    needs: terraform-check
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build da Imagem
        run: docker build -t fintech-app:${{ github.sha }} ./app

      - name: Patch & Push Manifest
        run: |
          [ -f k8s/deployment.yaml ] || { echo "Manifesto não encontrado!"; exit 1; }
          sed -i "s|image: fintech-app:.*|image: fintech-app:${{ github.sha }}|g" k8s/deployment.yaml
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [[ -n $(git status --porcelain) ]]; then
            git add k8s/deployment.yaml
            git commit -m "🚀 GitOps: Atualizado para ${{ github.sha }}"
            git push origin main
          else
            echo "Nenhuma alteração necessária, pulando commit."
          fi
